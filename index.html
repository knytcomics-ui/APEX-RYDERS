<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1024" />
    <title>APEX RYDERS</title>
    <link rel="preload" href="/fonts/exo2-italic-latin.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      html, body { margin: 0; height: 100%; background: #0b1024; overflow: hidden; touch-action: none; overscroll-behavior: none; }
      #app { width: 100vw; height: 100vh; height: 100dvh; }
      canvas { display: block; }
      /* Static first-paint splash: visible while the game bundle downloads and parses
         (Phaser alone is ~20 MB unminified in dev). The menu layer replaces it seamlessly. */
      #boot-splash { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5vh;
        background: radial-gradient(90% 70% at 50% 40%, #1d5fd6, #0b1d58 60%, #050b24); transition: opacity .25s; }
      #boot-splash img { width: min(70vw, 46em); filter: drop-shadow(0 .5em 1.2em rgba(0, 0, 0, .55)); }
      #boot-splash .bar { position: relative; width: min(70vw, 30em); height: 1.5em; border-radius: .25em; background: #0a1534; box-shadow: inset 0 0 0 .12em rgba(95, 180, 255, .4); overflow: hidden; font-size: clamp(12px, min(1.95vh, 1.35vw), 22px); }
      #boot-splash .bar i { position: absolute; inset: .18em auto .18em .18em; width: 0; border-radius: .15em; background: linear-gradient(90deg, #ffb300, #ffe36b, #ffb300); animation: boot-fill 8s cubic-bezier(.1, .7, .2, 1) forwards; }
      @keyframes boot-fill { to { width: 40%; } }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot-splash"><img src="/assets/logo.png" alt="Apex Ryders" /><div class="bar"><i></i></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
